name: sync-upstream

# Keeps the `patched` branch rebased on top of MetaCubeX/mihomo (Alpha by
# default, switch with the repository variable BASE_BRANCH, e.g.
# `gh variable set BASE_BRANCH --body Meta --repo <owner>/mihomo`):
#   1. rebase patched onto upstream/Alpha (or BASE_BRANCH)
#   2. force-push (the branch is always "upstream + our patch commit")
#   3. call build-release.yml (reusable workflow) to publish fresh binaries
# If the rebase conflicts (upstream touched the same code) the branch is left
# untouched and an issue is opened instead.
#
# The GitHub "Sync fork" button does the same merge by hand - it syncs
# fork:<name> from upstream:<name>, which is why this branch is called `Alpha`
# and not something fork-specific. Upstream's default branch is `main`, but
# that is an unrelated legacy tree; `Alpha` is the Go proxy code. A fork-only
# branch name would make GitHub compare against that `main` tree and always
# conflict (measured: POST /merge-upstream {"branch":"<fork-only>"} -> 409).
#
# This workflow exists next to the button because it can do two things the
# button cannot: fail loudly with an issue when the patch needs a manual
# conflict resolution, and rebuild/republish the binaries afterwards.

on:
  schedule:
    - cron: "23 2 * * *" # daily
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild the rolling release even when upstream has not moved"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.push.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Alpha
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "patched-sync-bot"
          git config user.email "patched-sync-bot@users.noreply.github.com"

      - name: Merge upstream/Alpha
        id: rebase
        run: |
          base="${{ vars.BASE_BRANCH || 'Alpha' }}"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          git remote add upstream https://github.com/MetaCubeX/mihomo.git
          git fetch upstream "$base"
          echo "upstream=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          if git merge --no-edit FETCH_HEAD; then
            echo "state=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the rebased branch
        id: push
        if: steps.rebase.outputs.state == 'merged'
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/Alpha)" ]; then
            echo "already up to date with upstream (${{ steps.rebase.outputs.upstream }})"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git push origin Alpha
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a rebase conflict
        if: steps.rebase.outputs.state == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error::Alpha needs a manual merge of upstream/${{ steps.rebase.outputs.base }} (${{ steps.rebase.outputs.upstream }}) - see the run summary and the issue opened below"
          title="Alpha branch needs a manual merge of upstream/${{ steps.rebase.outputs.base }}"
          body=$(cat <<EOF
          Merging upstream \`${{ steps.rebase.outputs.base }}\` (\`${{ steps.rebase.outputs.upstream }}\`) conflicts with the failover patch.

          The branch was left untouched, so nothing is broken - but the patch has
          to be ported by hand before the next build:

          \`\`\`sh
          git clone --branch Alpha git@github.com:${{ github.repository }}.git
          cd mihomo && git remote add upstream https://github.com/MetaCubeX/mihomo.git
          git fetch upstream ${{ steps.rebase.outputs.base }}
          git merge FETCH_HEAD          # resolve conflicts, then:
          git push origin Alpha
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail loudly on conflict
        if: steps.rebase.outputs.state == 'conflict'
        run: exit 1

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the build
  # is called directly (reusable workflow) instead of being dispatched.
  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force_build == true
    uses: ./.github/workflows/build-release.yml
